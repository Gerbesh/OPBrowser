name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Verify generated HTML reference table
        run: python tools/generate_html_entities.py --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Win32 startup smoke test
        run: cargo run -p op_browser -- --smoke-test

      - name: Native navigation smoke test
        run: cargo run -p op_browser -- --navigation-smoke-test

      - name: Hyperlink navigation smoke test
        run: cargo run -p op_browser -- --link-smoke-test

      - name: Legacy HTML encoding smoke test
        run: cargo run -p op_browser -- --navigation-smoke-test examples/encoding/windows-1251.html

      - name: Full named-reference hyperlink smoke test
        run: cargo run -p op_browser -- --link-smoke-test examples/encoding/named-references.html

      - name: Release build
        run: cargo build -p op_browser --release
