name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows / Rust
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Verify generated HTML reference table
        run: python tools/generate_html_entities.py --check

      - name: Verify generated CSS named color table
        run: python tools/generate_css_named_colors.py --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Compatibility regression baseline
        shell: pwsh
        run: .\tools\compatibility.ps1

      - name: Win32 startup smoke test
        run: cargo run -p op_browser -- --smoke-test

      - name: Native navigation smoke test
        run: cargo run -p op_browser -- --navigation-smoke-test

      - name: Hyperlink navigation smoke test
        run: cargo run -p op_browser -- --link-smoke-test

      - name: Legacy HTML encoding smoke test
        run: cargo run -p op_browser -- --navigation-smoke-test examples/encoding/windows-1251.html

      - name: Full named-reference hyperlink smoke test
        run: cargo run -p op_browser -- --link-smoke-test examples/encoding/named-references.html

      - name: Native image paint smoke test
        run: cargo run -p op_browser -- --image-smoke-test

      - name: Image hyperlink smoke test
        run: cargo run -p op_browser -- --link-smoke-test examples/images/index.html

      - name: Mixed inline image paint smoke test
        run: cargo run -p op_browser -- --image-smoke-test examples/images/inline.html

      - name: Mixed inline image hyperlink smoke test
        run: cargo run -p op_browser -- --link-smoke-test examples/images/inline.html

      - name: Native resize reflow and hyperlink smoke test
        run: cargo run -p op_browser -- --resize-smoke-test

      - name: Release build
        run: cargo build -p op_browser --release
